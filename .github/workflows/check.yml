name: GNOME 46 checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install check tools
        run: sudo apt-get update && sudo apt-get install -y libglib2.0-bin zip nodejs python3
      - name: Check and package
        run: make check pack && git diff --check
